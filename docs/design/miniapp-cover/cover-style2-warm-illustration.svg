<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">

  <!-- ============ 背景 ============ -->
  <g id="背景">
    <rect x="0" y="0" width="390" height="844" fill="#FFFCF6"/>
    <g id="装饰-小星星" stroke="#F0C9A8" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <path d="M348,116 h10 M353,111 v10"/>
      <path d="M26,258 h8 M30,254 v8"/>
      <circle cx="366" cy="316" r="2.4" fill="#F0C9A8" stroke="none"/>
    </g>
  </g>

  <!-- ============ 品牌区 ============ -->
  <g id="品牌区">
    <g id="logo-印章">
      <rect x="30" y="58" width="64" height="64" rx="9" fill="#C13530"/>
      <rect x="34" y="62" width="56" height="56" rx="6" fill="none" stroke="#FFFCF6" stroke-width="1.6" opacity="0.9"/>
      <text x="46" y="90" font-size="23" font-weight="800" fill="#FFFCF6" text-anchor="middle" font-family="'Songti SC','Noto Serif SC',serif">阿</text>
      <text x="78" y="90" font-size="23" font-weight="800" fill="#FFFCF6" text-anchor="middle" font-family="'Songti SC','Noto Serif SC',serif">福</text>
      <text x="46" y="115" font-size="23" font-weight="800" fill="#FFFCF6" text-anchor="middle" font-family="'Songti SC','Noto Serif SC',serif">凉</text>
      <text x="78" y="115" font-size="23" font-weight="800" fill="#FFFCF6" text-anchor="middle" font-family="'Songti SC','Noto Serif SC',serif">菜</text>
    </g>
    <text id="文字-店名" x="112" y="98" font-size="31" font-weight="900" letter-spacing="2"
          fill="#E5441E" stroke="#7A3417" stroke-width="5" stroke-linejoin="round" paint-order="stroke">丹桂阿福凉菜</text>
    <text id="文字-拼音" x="113" y="124" font-size="13" letter-spacing="1"
          fill="#8C4A21" font-family="'Chalkboard SE','Comic Sans MS','PingFang SC',cursive">dan gui a fu liang cai</text>
    <g id="标签-30年老店">
      <rect x="112" y="139" width="138" height="22" rx="11" fill="#F6DCC8"/>
      <text x="181" y="154" font-size="10.5" font-weight="600" letter-spacing="0.5" fill="#C13530" text-anchor="middle">30年老店 · 1995—2025</text>
    </g>
  </g>

  <!-- ============ 轮播横幅（可点击） ============ -->
  <g id="横幅按钮-每日现做">
    <rect x="24" y="192" width="342" height="100" rx="50" fill="#FAE9DB"/>
    <path id="装饰-左箭头" d="M60,234 l-11,8 l11,8" fill="none" stroke="#8C4A21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="装饰-右箭头" d="M330,234 l11,8 l-11,8" fill="none" stroke="#8C4A21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="图标-食盒">
      <rect x="86" y="216" width="52" height="52" rx="8" fill="#8C4A21"/>
      <rect x="100" y="236" width="24" height="9" rx="3.5" fill="#FFFCF6"/>
    </g>
    <text x="158" y="240" font-size="18" font-weight="700" letter-spacing="2" fill="#3A2A20">现做凉菜 · 当日鲜</text>
    <text x="159" y="263" font-size="8.5" letter-spacing="2" fill="#8C4A21">FRESH MADE DAILY SINCE 1995</text>
  </g>

  <!-- ============ 主入口按钮 ============ -->
  <g id="按钮组-主入口">
    <g id="按钮-同城配送">
      <rect x="24" y="326" width="166" height="168" rx="20" fill="#FFFFFF" stroke="#F6DCC8" stroke-width="2.5"/>
      <g id="图标-配送摩托">
        <circle cx="84" cy="402" r="10" fill="none" stroke="#8C4A21" stroke-width="3"/>
        <circle cx="84" cy="402" r="2.4" fill="#8C4A21"/>
        <circle cx="136" cy="402" r="10" fill="none" stroke="#8C4A21" stroke-width="3"/>
        <circle cx="136" cy="402" r="2.4" fill="#8C4A21"/>
        <path d="M84,402 h26 c8,-2 10,-12 12,-22 l2,-8" fill="none" stroke="#8C4A21" stroke-width="3" stroke-linecap="round"/>
        <path d="M118,372 l14,-4" stroke="#8C4A21" stroke-width="3" stroke-linecap="round"/>
        <circle cx="134" cy="367.5" r="2.6" fill="#8C4A21"/>
        <rect x="66" y="358" width="36" height="32" rx="5" fill="#E5441E"/>
        <rect x="66" y="370" width="36" height="6" fill="#FFFCF6" opacity="0.85"/>
        <path d="M52,372 h10 M48,384 h10" stroke="#8C4A21" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
      </g>
      <text x="107" y="458" font-size="21" font-weight="800" letter-spacing="3" fill="#3A2A20" text-anchor="middle">同城配送</text>
      <text x="107" y="478" font-size="8.5" letter-spacing="1.5" fill="#8C4A21" text-anchor="middle">SAME-CITY DELIVERY</text>
    </g>
    <g id="按钮-全国邮寄">
      <rect x="200" y="326" width="166" height="168" rx="20" fill="#FFFFFF" stroke="#F6DCC8" stroke-width="2.5"/>
      <g id="图标-邮寄包裹">
        <path d="M236,374 q8,-8 18,-6" fill="none" stroke="#8C4A21" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
        <path d="M272,368 l30,-14 l-9,25 l-9,-7 z" fill="#E5441E"/>
        <rect x="255" y="382" width="56" height="42" rx="6" fill="#F6DCC8" stroke="#8C4A21" stroke-width="3"/>
        <rect x="279" y="382" width="9" height="42" fill="#FFFFFF" opacity="0.9"/>
        <rect x="294" y="406" width="12" height="10" rx="2" fill="#E5441E"/>
      </g>
      <text x="283" y="458" font-size="21" font-weight="800" letter-spacing="3" fill="#3A2A20" text-anchor="middle">全国邮寄</text>
      <text x="283" y="478" font-size="8.5" letter-spacing="1.5" fill="#8C4A21" text-anchor="middle">NATIONWIDE SHIPPING</text>
    </g>
  </g>

  <!-- ============ 会员服务入口 ============ -->
  <g id="按钮组-会员服务">
    <g id="按钮-会员中心">
      <rect x="24" y="522" width="106" height="96" rx="16" fill="#FAE9DB"/>
      <circle cx="77" cy="556" r="20" fill="#FFFFFF"/>
      <path d="M63,562 l3,-13 l7,8 l4,-12 l4,12 l7,-8 l3,13 z" fill="none" stroke="#E5441E" stroke-width="2.4" stroke-linejoin="round"/>
      <line x1="65" y1="566" x2="89" y2="566" stroke="#E5441E" stroke-width="2.4" stroke-linecap="round"/>
      <text x="77" y="596" font-size="14.5" font-weight="700" fill="#3A2A20" text-anchor="middle">会员中心</text>
      <text x="77" y="610" font-size="7.5" letter-spacing="1.5" fill="#8C4A21" text-anchor="middle">MEMBER</text>
    </g>
    <g id="按钮-会员储值">
      <rect x="142" y="522" width="106" height="96" rx="16" fill="#FAE9DB"/>
      <circle cx="195" cy="556" r="20" fill="#FFFFFF"/>
      <circle cx="195" cy="556" r="12.5" fill="none" stroke="#E5441E" stroke-width="2.4"/>
      <text x="195" y="561.5" font-size="14" font-weight="800" fill="#E5441E" text-anchor="middle">¥</text>
      <text x="195" y="596" font-size="14.5" font-weight="700" fill="#3A2A20" text-anchor="middle">会员储值</text>
      <text x="195" y="610" font-size="7.5" letter-spacing="1.5" fill="#8C4A21" text-anchor="middle">RECHARGE</text>
    </g>
    <g id="按钮-积分商城">
      <rect x="260" y="522" width="106" height="96" rx="16" fill="#FAE9DB"/>
      <circle cx="313" cy="556" r="20" fill="#FFFFFF"/>
      <rect x="301" y="552" width="24" height="15" rx="2" fill="none" stroke="#E5441E" stroke-width="2.4"/>
      <line x1="313" y1="552" x2="313" y2="567" stroke="#E5441E" stroke-width="2.4"/>
      <path d="M313,552 c-4,-9 -13,-6 -8,0 M313,552 c4,-9 13,-6 8,0" fill="none" stroke="#E5441E" stroke-width="2.4" stroke-linecap="round"/>
      <text x="313" y="596" font-size="14.5" font-weight="700" fill="#3A2A20" text-anchor="middle">积分商城</text>
      <text x="313" y="610" font-size="7.5" letter-spacing="1.5" fill="#8C4A21" text-anchor="middle">POINTS MALL</text>
    </g>
  </g>

  <!-- ============ 品牌故事卡 ============ -->
  <g id="装饰-品牌卡">
    <rect x="24" y="642" width="342" height="98" rx="18" fill="#E5441E"/>
    <text x="48" y="686" font-size="19" font-weight="800" letter-spacing="2" fill="#FFFFFF">家的味道 · 三十年如一日</text>
    <text x="48" y="712" font-size="11" letter-spacing="1" fill="#FFD3C2">丹桂阿福凉菜 · 老巷手作凉菜</text>
    <circle cx="316" cy="691" r="24" fill="none" stroke="#FFD3C2" stroke-width="1.6"/>
    <text x="316" y="689" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">30</text>
    <text x="316" y="703" font-size="8.5" fill="#FFD3C2" text-anchor="middle">周年</text>
  </g>

  <!-- ============ 底部标签栏 ============ -->
  <g id="标签栏">
    <rect x="0" y="782" width="390" height="62" fill="#FFFFFF"/>
    <line x1="0" y1="782" x2="390" y2="782" stroke="#F0E3D6" stroke-width="1.5"/>
    <g id="标签-首页">
      <path d="M39,808 L49,798 L59,808 M42,806 V818 H56 V806" fill="none" stroke="#E5441E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="49" y="834" font-size="9.5" font-weight="600" fill="#E5441E" text-anchor="middle">首页</text>
    </g>
    <g id="标签-分类">
      <g fill="none" stroke="#B9A896" stroke-width="2">
        <rect x="137" y="799" width="8" height="8" rx="1.5"/><rect x="147" y="799" width="8" height="8" rx="1.5"/>
        <rect x="137" y="809" width="8" height="8" rx="1.5"/><rect x="147" y="809" width="8" height="8" rx="1.5"/>
      </g>
      <text x="146" y="834" font-size="9.5" fill="#B9A896" text-anchor="middle">分类</text>
    </g>
    <g id="标签-购物车">
      <path d="M234,800 h4 l3,12 h11 l3,-9 h-14" fill="none" stroke="#B9A896" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="243" cy="817" r="2.2" fill="#B9A896"/><circle cx="251" cy="817" r="2.2" fill="#B9A896"/>
      <text x="244" y="834" font-size="9.5" fill="#B9A896" text-anchor="middle">购物车</text>
    </g>
    <g id="标签-我的">
      <circle cx="341" cy="803" r="4.5" fill="none" stroke="#B9A896" stroke-width="2"/>
      <path d="M333,818 q8,-10 16,0" fill="none" stroke="#B9A896" stroke-width="2" stroke-linecap="round"/>
      <text x="341" y="834" font-size="9.5" fill="#B9A896" text-anchor="middle">我的</text>
    </g>
  </g>
</svg>
