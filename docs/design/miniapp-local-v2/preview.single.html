<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿福凉菜 · 双渠道导航与同城结算预览</title>
<style>
/* 小程序双渠道导航与同城结算 —— 独立视觉预览样式
 *
 * 这份 CSS 不是小程序代码，也不会被打包进 apps/miniapp。它只为了让店主在浏览器里
 * 按真实尺寸看清「改完之后长什么样」。
 *
 * 两条尺寸约定，和真机保持一致：
 *   1. 1rpx = 画布宽 / 750。用 calc(N * var(--rpx)) 表达，两种画布共用一套规则。
 *   2. tabBar 是**原生组件，画在 WebView 之外**。所以 .screen（= 页面可视区）
 *      不包含 tabBar；页面里 bottom:0 的固定条天然落在 tabBar 之上，不需要任何偏移。
 *      预览把 .tabbar 画成 .screen 的兄弟节点，就是为了复刻这个关系。
 *
 * 颜色 token 抄自 apps/miniapp/app.wxss，改动时两边一起改。
 */

:root {
  --brand: #e5441e;
  --brand-dark: #c33514;
  --brand-light: #ef7150;
  --brand-bg: #fef4f0;
  --brand-gradient: linear-gradient(135deg, #ff6a3d 0%, #e5441e 100%);
  --text-1: #1a1a1a;
  --text-2: #666666;
  --text-3: #999999;
  --text-disabled: #c8c9cc;
  --border: #ebedf0;
  --divider: #f2f3f5;
  --bg: #f5f6f7;
  --card: #ffffff;
  --warning: #ff9500;
  --warning-bg: #fff7e8;
  --info: #3b82f6;
  --info-bg: #eff6ff;
  --success: #16a34a;
  --success-bg: #f0fdf4;
  --gray: #9ca3af;
  --gray-bg: #f3f4f6;
  --danger: #ef4444;
  --danger-bg: #fef2f2;
  --shadow-card: 0 2rpx 12rpx rgba(0, 0, 0, 0.04);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #eef0f3;
  color: #1a1a1a;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
}

/* ---------------- 控制台 ---------------- */

.shell { display: flex; align-items: flex-start; gap: 24px; padding: 20px; }

.rail {
  position: sticky;
  top: 20px;
  width: 250px;
  flex: 0 0 250px;
  background: #fff;
  border: 1px solid #e2e5ea;
  border-radius: 12px;
  padding: 16px;
  max-height: calc(100vh - 40px);
  overflow: auto;
}

.rail h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .01em; }
.rail .sub { font-size: 11px; color: #8b93a1; margin: 0 0 14px; line-height: 1.5; }
.rail h2 {
  font-size: 11px; color: #8b93a1; margin: 16px 0 7px;
  text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
}
.rail h2:first-of-type { margin-top: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 12px; padding: 5px 10px; border-radius: 999px;
  border: 1px solid #dfe3e9; background: #fff; color: #4a5160;
  cursor: pointer; line-height: 1.3;
}
.chip:hover { border-color: #b9c0cc; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.chip[disabled] { opacity: .35; cursor: not-allowed; }

.toggle-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4a5160; margin-top: 8px; }

.probe-btn {
  width: 100%; margin-top: 14px; padding: 9px 10px; font-size: 12px; cursor: pointer;
  border-radius: 8px; border: 1px solid #cfd5de; background: #f7f8fa; color: #2f3742;
}
.probe-btn:hover { background: #eef1f5; }
.probe-out {
  margin-top: 9px; font-size: 11px; line-height: 1.6; white-space: pre-wrap;
  color: #4a5160; background: #f7f8fa; border-radius: 8px; padding: 9px; display: none;
}
.probe-out.show { display: block; }
.probe-out.bad { color: #b42318; background: #fef2f2; }
.probe-out.good { color: #15803d; background: #f0fdf4; }

/* ---------------- 手机画布 ---------------- */

.stage { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }

.device { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.device-label { font-size: 11px; color: #8b93a1; }

.frame {
  position: relative;
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 28px rgba(20, 28, 44, .16);
  display: flex;
  flex-direction: column;
}
.frame.w375 { width: 375px; height: 812px; --rpx: 0.5px; }
.frame.w320 { width: 320px; height: 568px; --rpx: 0.42666667px; }

/* 微信胶囊条（只为空间感，不可交互） */
.statusbar {
  height: 44px; flex: 0 0 44px; background: #fff; display: flex; align-items: center;
  justify-content: space-between; padding: 0 12px; font-size: 12px; color: #1a1a1a;
  border-bottom: 1px solid rgba(0,0,0,.03);
}
.frame.w320 .statusbar { height: 36px; flex-basis: 36px; }
.capsule {
  width: 78px; height: 30px; border-radius: 999px; border: 1px solid #e6e6e6;
  display: flex; align-items: center; justify-content: space-around; color: #9aa0a6; font-size: 13px;
}

/* .viewport = 小程序页面可视区，**不含 tabBar**。
 * .screen 只负责滚动；bottom:0 的固定条与遮罩是 .viewport 的直接子节点——
 * 绝对定位在滚动容器内部会跟着内容一起滚，必须挂在滚动层之外才等价于真机的 position:fixed。 */
.viewport {
  position: relative; flex: 1 1 auto; min-height: 0;
  overflow: hidden; background: var(--bg);
}
.screen {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: auto;
}
.screen::-webkit-scrollbar { width: 0; height: 0; }

.tabbar {
  flex: 0 0 auto; display: flex; background: #fff;
  border-top: 1px solid rgba(0,0,0,.06);
  height: calc(98rpx * 1); height: calc(98 * var(--rpx));
  padding-bottom: 0;
}
.tabbar-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(4 * var(--rpx)); color: #999; cursor: pointer; position: relative;
}
.tabbar-item.on { color: var(--brand); }
.tabbar-item img { width: calc(46 * var(--rpx)); height: calc(46 * var(--rpx)); display: block; }
.tabbar-item span { font-size: calc(20 * var(--rpx)); line-height: 1.2; }
.tabbar-badge {
  position: absolute; top: calc(4 * var(--rpx)); left: 55%;
  min-width: calc(28 * var(--rpx)); height: calc(28 * var(--rpx)); padding: 0 calc(6 * var(--rpx));
  border-radius: 999px; background: var(--brand); color: #fff;
  font-size: calc(18 * var(--rpx)); line-height: calc(28 * var(--rpx)); text-align: center;
}

/* ---------------- 页面通用 ---------------- */

.page { padding-bottom: calc(24 * var(--rpx)); }
.page.has-bottombar { padding-bottom: calc(190 * var(--rpx)); }
.page.has-cartbar { padding-bottom: calc(130 * var(--rpx)); }

.card {
  background: var(--card); border-radius: calc(12 * var(--rpx));
  box-shadow: var(--shadow-card); margin: calc(20 * var(--rpx));
  padding: calc(24 * var(--rpx));
}
.card + .card { margin-top: calc(20 * var(--rpx)); }
.card-title {
  font-size: calc(28 * var(--rpx)); font-weight: 600; color: var(--text-1);
  margin-bottom: calc(16 * var(--rpx));
}

.row { display: flex; align-items: center; }
.row-between { display: flex; align-items: center; justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.t1 { color: var(--text-1); }
.t2 { color: var(--text-2); }
.t3 { color: var(--text-3); }
.fs22 { font-size: calc(22 * var(--rpx)); }
.fs24 { font-size: calc(24 * var(--rpx)); }
.fs26 { font-size: calc(26 * var(--rpx)); }
.fs28 { font-size: calc(28 * var(--rpx)); }
.fs30 { font-size: calc(30 * var(--rpx)); }
.bold { font-weight: 600; }

.btn-primary {
  background: var(--brand-gradient); color: #fff; border-radius: 999px;
  text-align: center; font-weight: 600; border: none;
}
.btn-disabled { background: var(--text-disabled) !important; color: #fff !important; }
.btn-plain {
  background: var(--brand-bg); color: var(--brand); border: 1px solid var(--brand-light);
  border-radius: 999px; text-align: center;
}

.img-ph {
  background: repeating-linear-gradient(45deg, #eceef1 0 6px, #f5f6f8 6px 12px);
  border-radius: calc(8 * var(--rpx));
}

/* ---------------- 同城门店头（Spec §4.1） ---------------- */

.store-head { background: #fff; padding: calc(24 * var(--rpx)) calc(24 * var(--rpx)) calc(20 * var(--rpx)); }

/* 关键修正：flex-start，不再 space-between。
   店名可省略、可收缩；胶囊不可收缩、不换行、内容自适应。 */
.store-title-row {
  display: flex; align-items: center; justify-content: flex-start;
  gap: calc(12 * var(--rpx));
}
.store-name-wrap { display: flex; align-items: center; flex: 0 1 auto; min-width: 0; gap: calc(10 * var(--rpx)); }
.store-icon { width: calc(36 * var(--rpx)); height: calc(36 * var(--rpx)); flex: 0 0 auto; }
.store-name {
  font-size: calc(34 * var(--rpx)); font-weight: 600; color: var(--text-1);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.status-pill {
  display: inline-flex; align-items: center; flex: 0 0 auto;
  white-space: nowrap; box-sizing: border-box;
  font-size: calc(22 * var(--rpx)); line-height: 1;
  padding: calc(7 * var(--rpx)) calc(14 * var(--rpx));
  border-radius: 999px;
}
.status-pill.open { background: var(--success-bg); color: var(--success); }
.status-pill.paused { background: var(--warning-bg); color: var(--warning); }
.status-pill.closed { background: var(--gray-bg); color: var(--gray); }

.delivery-rules {
  display: block; margin-top: calc(12 * var(--rpx));
  font-size: calc(24 * var(--rpx)); color: var(--text-2); line-height: 1.5;
}
.head-notice {
  display: flex; align-items: center; justify-content: space-between; gap: calc(16 * var(--rpx));
  margin-top: calc(16 * var(--rpx)); padding: calc(14 * var(--rpx)) calc(18 * var(--rpx));
  background: var(--warning-bg); border-radius: calc(10 * var(--rpx));
}
.head-notice-text { font-size: calc(24 * var(--rpx)); color: #a15c00; line-height: 1.45; }
.head-notice-action {
  flex: 0 0 auto; font-size: calc(24 * var(--rpx)); color: var(--brand);
  white-space: nowrap; text-decoration: underline;
}

/* EXPRESS 主页顶栏（保留「回封面」） */
.navbar {
  display: flex; align-items: center; gap: calc(12 * var(--rpx));
  background: #fff; padding: calc(18 * var(--rpx)) calc(24 * var(--rpx));
}
.navbar-back {
  font-size: calc(24 * var(--rpx)); color: var(--text-2);
  border: 1px solid var(--border); border-radius: 999px;
  padding: calc(6 * var(--rpx)) calc(16 * var(--rpx)); white-space: nowrap;
}
.navbar-title { font-size: calc(32 * var(--rpx)); font-weight: 600; }

/* ---------------- 主页 ---------------- */

.banner {
  height: calc(260 * var(--rpx)); margin: calc(20 * var(--rpx));
  border-radius: calc(16 * var(--rpx));
  background: linear-gradient(135deg, #7d8f7a 0%, #55684f 100%);
  color: #fff; display: flex; flex-direction: column; justify-content: flex-end;
  padding: calc(24 * var(--rpx)); gap: calc(6 * var(--rpx));
}
.banner b { font-size: calc(32 * var(--rpx)); }
.banner span { font-size: calc(22 * var(--rpx)); opacity: .85; }

.quick-cats { display: flex; gap: calc(16 * var(--rpx)); padding: 0 calc(20 * var(--rpx)); overflow-x: auto; }
.quick-cat {
  flex: 0 0 auto; background: #fff; border-radius: calc(12 * var(--rpx));
  padding: calc(16 * var(--rpx)) calc(22 * var(--rpx));
  font-size: calc(24 * var(--rpx)); color: var(--text-1); box-shadow: var(--shadow-card);
}
.quick-cat.on { background: var(--brand-bg); color: var(--brand); }

.sec-title {
  padding: calc(24 * var(--rpx)) calc(24 * var(--rpx)) calc(8 * var(--rpx));
  font-size: calc(28 * var(--rpx)); font-weight: 600;
}

.prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: calc(20 * var(--rpx)); padding: 0 calc(20 * var(--rpx)); }
.prod-card { background: #fff; border-radius: calc(12 * var(--rpx)); overflow: hidden; box-shadow: var(--shadow-card); }
.prod-card .img-ph { height: calc(210 * var(--rpx)); border-radius: 0; }
.prod-card .body { padding: calc(16 * var(--rpx)); }
.prod-card .nm { font-size: calc(26 * var(--rpx)); font-weight: 600; }
.prod-card .meta { font-size: calc(20 * var(--rpx)); color: var(--text-3); margin-top: calc(6 * var(--rpx)); }
.prod-card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: calc(10 * var(--rpx)); }

.price { color: var(--brand); font-weight: 600; display: inline-flex; align-items: baseline; }
.price .sym { font-size: calc(20 * var(--rpx)); }
.price .int { font-size: calc(32 * var(--rpx)); }
.price .dec { font-size: calc(20 * var(--rpx)); }
.price .suffix { font-size: calc(20 * var(--rpx)); color: var(--text-3); font-weight: 400; margin-left: calc(4 * var(--rpx)); }

.add-btn {
  width: calc(48 * var(--rpx)); height: calc(48 * var(--rpx)); border-radius: 999px;
  background: var(--brand-gradient); color: #fff; font-size: calc(32 * var(--rpx));
  display: flex; align-items: center; justify-content: center; flex: 0 0 auto; line-height: 1;
}
.add-btn.off { background: var(--text-disabled); }

/* ---------------- 分类页 ---------------- */

.menu-body { display: flex; height: 100%; }
.cat-panel { width: calc(180 * var(--rpx)); flex: 0 0 auto; background: #f3f4f6; }
.cat-item {
  position: relative; padding: calc(28 * var(--rpx)) calc(16 * var(--rpx));
  font-size: calc(26 * var(--rpx)); color: var(--text-2); text-align: center;
}
.cat-item.on { background: #fff; color: var(--text-1); font-weight: 600; }
.cat-item.on::before {
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: calc(6 * var(--rpx)); height: calc(32 * var(--rpx)); background: var(--brand);
  border-radius: 0 calc(4 * var(--rpx)) calc(4 * var(--rpx)) 0;
}
.prod-panel { flex: 1 1 auto; min-width: 0; background: #fff; }

.searchbar { padding: calc(16 * var(--rpx)) calc(20 * var(--rpx)); background: #fff; }
.searchbar div {
  background: var(--divider); border-radius: 999px; color: var(--text-3);
  font-size: calc(24 * var(--rpx)); padding: calc(14 * var(--rpx)) calc(24 * var(--rpx));
}

.product-row { display: flex; gap: calc(16 * var(--rpx)); padding: calc(20 * var(--rpx)); border-bottom: 1px solid var(--divider); }
.product-row .img-ph { width: calc(150 * var(--rpx)); height: calc(150 * var(--rpx)); flex: 0 0 auto; }
.product-row .info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: calc(6 * var(--rpx)); }
.product-row .nm { font-size: calc(28 * var(--rpx)); font-weight: 600; }
.product-row .sub { font-size: calc(22 * var(--rpx)); color: var(--text-3); }
.product-row .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }

/* ---------------- 购物车条 / 底部栏 ----------------
 * 都是 position:absolute; bottom:0 —— 在 .screen 内部，天然位于原生 tabBar 之上。
 * 真机上对应 position:fixed; bottom:0，不需要为 tabBar 留任何偏移。
 */

.cart-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  background: #fff; border-top: 1px solid var(--divider);
  padding: calc(14 * var(--rpx)) calc(24 * var(--rpx));
  box-shadow: 0 -2px 10px rgba(0,0,0,.05);
}
.cart-bar .sum { display: flex; align-items: center; gap: calc(14 * var(--rpx)); min-width: 0; }
.cart-bar .badge {
  width: calc(48 * var(--rpx)); height: calc(48 * var(--rpx)); border-radius: 999px;
  background: var(--brand); color: #fff; font-size: calc(24 * var(--rpx));
  display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
}
.cart-bar .txt { display: flex; flex-direction: column; min-width: 0; }
.cart-bar .go {
  flex: 0 0 auto; padding: calc(14 * var(--rpx)) calc(34 * var(--rpx));
  font-size: calc(26 * var(--rpx)); white-space: nowrap;
}

.bottom-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  background: #fff; border-top: 1px solid var(--divider);
  padding: calc(12 * var(--rpx)) calc(24 * var(--rpx)) calc(16 * var(--rpx));
}
.block-strip {
  display: flex; align-items: center; justify-content: space-between; gap: calc(12 * var(--rpx));
  background: var(--danger-bg); color: #b42318; border-radius: calc(10 * var(--rpx));
  padding: calc(12 * var(--rpx)) calc(16 * var(--rpx)); margin-bottom: calc(10 * var(--rpx));
  font-size: calc(22 * var(--rpx)); line-height: 1.4;
}
.block-strip.warn { background: var(--warning-bg); color: #a15c00; }
.block-strip .acts { display: flex; gap: calc(10 * var(--rpx)); flex: 0 0 auto; }
.block-strip .acts span {
  border: 1px solid currentColor; border-radius: 999px; padding: calc(5 * var(--rpx)) calc(12 * var(--rpx));
  white-space: nowrap; font-size: calc(21 * var(--rpx));
}
.agree-row { font-size: calc(20 * var(--rpx)); color: var(--text-3); text-align: center; margin-bottom: calc(10 * var(--rpx)); }
.agree-row a { color: var(--brand); text-decoration: none; }
.bottom-main { display: flex; align-items: center; justify-content: space-between; gap: calc(16 * var(--rpx)); }
.bottom-total { display: flex; align-items: baseline; gap: calc(6 * var(--rpx)); min-width: 0; }
.bottom-total .lb { font-size: calc(24 * var(--rpx)); color: var(--text-2); }
.pending { font-size: calc(26 * var(--rpx)); color: var(--text-3); }
.submit-btn {
  flex: 0 0 auto; min-width: calc(220 * var(--rpx));
  padding: calc(18 * var(--rpx)) calc(30 * var(--rpx));
  font-size: calc(28 * var(--rpx)); white-space: nowrap;
}

/* ---------------- 结算页 ---------------- */

.addr-card { display: flex; align-items: flex-start; gap: calc(16 * var(--rpx)); }
.addr-pin {
  width: calc(36 * var(--rpx)); height: calc(36 * var(--rpx)); flex: 0 0 auto;
  margin-top: calc(4 * var(--rpx));
}
.addr-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: calc(6 * var(--rpx)); }
.addr-name-row { display: flex; align-items: center; gap: calc(14 * var(--rpx)); flex-wrap: wrap; }
.addr-name { font-size: calc(28 * var(--rpx)); font-weight: 600; }
.addr-phone { font-size: calc(24 * var(--rpx)); color: var(--text-2); }
.tag {
  font-size: calc(19 * var(--rpx)); padding: calc(3 * var(--rpx)) calc(10 * var(--rpx));
  border-radius: calc(6 * var(--rpx)); white-space: nowrap; flex: 0 0 auto;
}
.tag.default { background: var(--brand-bg); color: var(--brand); }
.tag.far { background: var(--warning-bg); color: var(--warning); }
.tag.noloc { background: var(--danger-bg); color: var(--danger); }
.addr-poi { font-size: calc(24 * var(--rpx)); color: var(--text-1); }
.addr-full { font-size: calc(24 * var(--rpx)); color: var(--text-2); line-height: 1.5; }
.addr-arrow { flex: 0 0 auto; color: var(--text-3); font-size: calc(28 * var(--rpx)); align-self: center; }
.addr-alert {
  margin-top: calc(10 * var(--rpx)); background: var(--warning-bg); color: #a15c00;
  border-radius: calc(8 * var(--rpx)); padding: calc(10 * var(--rpx)) calc(14 * var(--rpx));
  font-size: calc(22 * var(--rpx)); display: flex; align-items: center; justify-content: space-between;
  gap: calc(12 * var(--rpx));
}
.addr-alert span:last-child { color: var(--brand); white-space: nowrap; text-decoration: underline; }
.addr-empty { flex: 1 1 auto; font-size: calc(28 * var(--rpx)); color: var(--text-2); }

.dlv-line { font-size: calc(24 * var(--rpx)); color: var(--text-2); line-height: 1.7; }
.dlv-line b { color: var(--text-1); font-weight: 600; }
.dlv-skeleton { height: calc(24 * var(--rpx)); border-radius: 999px; background: var(--divider); margin: calc(10 * var(--rpx)) 0; }
.dlv-skeleton.s1 { width: 62%; }
.dlv-skeleton.s2 { width: 44%; }
.dlv-err { display: flex; align-items: center; justify-content: space-between; gap: calc(14 * var(--rpx)); }
.dlv-err span:first-child { font-size: calc(24 * var(--rpx)); color: var(--danger); line-height: 1.45; }
.retry-inline {
  flex: 0 0 auto; font-size: calc(23 * var(--rpx)); color: var(--brand);
  border: 1px solid var(--brand-light); border-radius: 999px;

  /**
   * 结算页唯一的按钮状态判定。优先级固定：地址 → 报价 → 业务阻塞 → 提交中。
   *
   * 按钮文案只允许这七种，长原因一律走页面提示区，不塞进按钮（否则小屏必溢出）：

        m.quoting = true; m.fee = null
        break
      case '报价失败':
        m.quoteError = true; m.fee = null
        break
      case '暂停接单':
        m.status = 'paused'; m.fee = null; m.couponId = null; m.discount = 0
        m.headNotice = '商家已暂停接单，现在无法下同城单'
        m.blockReason = '商家已暂停接单'
        m.blockActions = ['改用全国邮寄']
        break
      case '提交中':
        m.submitting = true
        break
      default:
        break
    }
    if (stress) {
      m.distanceSrc = '估算'
      m.etaText = '约 35–40 分钟送达'
      m.peakHint = '当前为高峰时段，出餐较慢'
    }
    m.subtotal = m.items.reduce((a, i) => a + i.price * i.qty, 0)
    m.action = checkoutAction(m)
    m.payAmount = m.action.amountState === 'ready' ? m.subtotal - m.discount + (m.fee || 0) : null
    return m
  }

    return `<div class="page has-bottombar">

        <div class="full">四川省自贡市贡井区筱溪街 88 号 2 栋 1 单元 302</div>
        <div class="fs22" style="color:var(--warning);margin-top:calc(8 * var(--rpx))">
          同城配送要先在地图上点一下门口，点「编辑」补充</div>
        <div class="acts"><span>编辑</span><span>删除</span></div></div>
      <div class="addr-item"><div class="top"><span class="addr-name">王女士</span>
          <span class="addr-phone">137****9001</span><span class="tag far">可能超范围</span>
          <span class="dist">直线约 9.6 km</span></div>
        <div class="full">四川省自贡市沿滩区沿滩新区兴隆路 5 号</div>
        <div class="fs22 t3" style="margin-top:calc(8 * var(--rpx))">
          最终以结算页按道路距离计算的结果为准</div>
        <div class="acts"><span>编辑</span><span>删除</span></div></div>
    </div>
    <div class="bottom-bar"><div class="bottom-main">
      <div class="submit-btn btn-primary" style="flex:1;min-width:0">新增收货地址</div></div></div>`
  }

  function pageAddressEdit(stress) {
    return `<div class="page has-bottombar">
      <div class="card">
        <div class="form-row"><span class="k">联系人</span><span class="v">${ADDR.name}</span></div>
        <div class="form-row"><span class="k">手机号</span><span class="v">138 6677 8899</span></div>
        <div class="form-row"><span class="k">所在地区</span><span class="v">四川省 自贡市 自流井区</span></div>
        <div class="form-row"><span class="k">详细地址</span>
          <span class="v">${esc(stress ? ADDR.longFull : '丹桂大街 12 号 3 栋 2 单元 501')}</span></div>
        <div class="form-row"><span class="k"><span class="req">*</span>地图定位</span>
          <span class="v ph">同城配送必填</span></div>
        <div class="map-btn">📍 在地图上选择门口位置</div>
        <div class="quote-strip">已定位「丹桂大街 12 号」· 距门店约 2.4 km · 预估配送费 ¥6.00<br>
          <span style="opacity:.75">仅供参考，下单时以结算页报价为准</span></div>
        <div class="form-row" style="border-bottom:none"><span class="k">设为默认</span>
          <div class="switch off" style="margin-left:auto"></div></div>
      </div>
      <div class="card"><div class="row-between"><span class="fs26">导入微信收货地址</span>
          <span class="chevron">›</span></div>
        <div class="fs21 t3" style="margin-top:calc(8 * var(--rpx));line-height:1.5">
          只带回联系人和文字地址，<b>不会带回地图定位</b>；导入后需要重新在地图上点一次。</div></div>
    </div>
    <div class="bottom-bar"><div class="bottom-main">
      <div class="submit-btn btn-primary" style="flex:1;min-width:0">保存并使用该地址</div></div></div>`
  }

  // ---------------------------------------------------------------- 渲染

  const S = { channel: 'LOCAL', page: 'home', ck: '正常', sheet: false, stress: false }
  const TAB_PAGES = ['home', 'category', 'cart', 'user']

  function screenHTML() {
    const ch = S.channel
    switch (S.page) {
      case 'home': return pageHome(ch, S.stress)
      case 'category': return pageCategory(ch)
      case 'cart': return pageCart(ch)
      case 'user': return pageUser(ch)
      case 'checkout': return pageCheckout(S.ck, S.stress) + (S.sheet ? couponSheet(S.stress) : '')
      case 'addressList': return pageAddressList()
      case 'addressEdit': return pageAddressEdit(S.stress)
      default: return ''
    }
  }

  function render() {
    const isTab = TAB_PAGES.indexOf(S.page) !== -1
    const badge = S.channel === 'LOCAL' ? 2 : 3
    const html = screenHTML()
    document.querySelectorAll('.frame').forEach((f) => {
      const vp = f.querySelector('.viewport')
      vp.querySelectorAll(':scope > :not(.screen)').forEach((n) => n.remove())
      const scr = vp.querySelector('.screen')
      scr.innerHTML = html
      // 固定条与遮罩挪出滚动层：留在 .screen 里的 position:absolute 会跟着内容滚，
      // 那与真机的 position:fixed 不是一回事（第一版就是这么错的）。
      scr.querySelectorAll(':scope > .bottom-bar, :scope > .cart-bar, :scope > .mask')
        .forEach((n) => vp.appendChild(n))
      const old = f.querySelector('.tabbar')
      if (old) old.remove()
      if (isTab) f.insertAdjacentHTML('beforeend', tabbar(S.page, badge))
    })
    document.querySelectorAll('[data-k]').forEach((el) => {
      el.setAttribute('aria-pressed', String(el.dataset.v === S[el.dataset.k]))
    })
    document.querySelectorAll('[data-k="ck"]').forEach((el) => { el.disabled = S.page !== 'checkout' })
    const sheetBtn = document.querySelector('#sheetBtn')
    sheetBtn.setAttribute('aria-pressed', String(S.sheet))
    sheetBtn.disabled = S.page !== 'checkout'
    document.querySelector('#stressBtn').setAttribute('aria-pressed', String(S.stress))
    hideProbe()
  }

  // ---------------------------------------------------------------- 溢出自检
  //
  // 「没有横向滚动」不能靠肉眼。这里量的是每个 .screen 自身的 scrollWidth，
  // 以及页面内每个元素相对画布右边界的越界量。命中的元素会被描红。

  function hideProbe() {
    const box = document.querySelector('#probeOut')
    box.className = 'probe-out'
    box.textContent = ''
    document.querySelectorAll('.overflow-hit').forEach((el) => el.classList.remove('overflow-hit'))
  }

  function probe() {
    document.querySelectorAll('.overflow-hit').forEach((el) => el.classList.remove('overflow-hit'))
    const lines = []
    document.querySelectorAll('.frame').forEach((f) => {
      const label = f.classList.contains('w375') ? '375×812' : '320×568'
      const vp = f.querySelector('.viewport')
      const scr = vp.querySelector('.screen')
      const over = scr.scrollWidth - scr.clientWidth
      const right = vp.getBoundingClientRect().right
      let hits = 0
      vp.querySelectorAll('*').forEach((el) => {
        const r = el.getBoundingClientRect()
        if (r.width > 0 && r.right - right > 0.5) {
          el.classList.add('overflow-hit'); hits++
          if (hits <= 4) {
            lines.push(`  ↳ ${el.className || el.tagName} 越界 ${(r.right - right).toFixed(1)}px`)
          }
        }
      })
      lines.unshift(`${label}：横向可滚动 ${over}px，越界元素 ${hits} 个`)
      if (hits > 4) lines.push(`  ↳ 其余 ${hits - 4} 个已描红`)
    })
    const bad = lines.some((l) => /横向可滚动 [1-9]/.test(l) || /越界元素 [1-9]/.test(l))
    const box = document.querySelector('#probeOut')
    box.className = 'probe-out show ' + (bad ? 'bad' : 'good')
    box.textContent = (bad ? '发现溢出：\n' : '两种画布都没有横向溢出。\n') + lines.join('\n')
  }

  // ---------------------------------------------------------------- 交互

  document.addEventListener('click', (e) => {
    const ctl = e.target.closest('[data-k]')
    if (ctl) {
      S[ctl.dataset.k] = ctl.dataset.v
      if (ctl.dataset.k === 'page') S.sheet = false
      if (ctl.dataset.k === 'channel' && S.page === 'checkout') S.page = 'home'
      return render()
    }
    const go = e.target.closest('[data-go]')
    if (go) {
      const v = go.dataset.go
      if (v === 'sheet') S.sheet = true
      else if (v === 'closesheet') { if (e.target.closest('.sheet') && !e.target.closest('[data-go="closesheet"]')) return; S.sheet = false }
      else { S.page = v; S.sheet = false }
      return render()
    }
    if (e.target.closest('#sheetBtn')) { S.sheet = !S.sheet; return render() }
    if (e.target.closest('#stressBtn')) { S.stress = !S.stress; return render() }
    if (e.target.closest('#probeBtn')) return probe()
  })

  // 状态按钮由 JS 生成，保证与 CK_STATES 单一来源一致
  document.querySelector('#ckStates').innerHTML = CK_STATES
    .map((s) => `<button class="chip" data-k="ck" data-v="${s}">${s}</button>`).join('')

  render()
})()

</script>
</body>
</html>
