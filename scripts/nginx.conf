# ============================================================
# Nginx 配置模板 — food-shop
# 将 yourdomain.com 替换为实际域名后使用
# 证书路径替换为 certbot / 腾讯云 SSL 证书的实际路径
# ============================================================

# 限流区定义（此文件经 conf.d/*.conf 被 include 进 http 上下文，limit_req_zone 必须位于 http 层级）
# 通用 API：每 IP 10 请求/秒；burst 见各 location
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 登录等敏感接口：每 IP 2 请求/秒（应用层 express-rate-limit 仍是第二道闸）
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/s;

# 后端 API
server {
    listen 80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/ssl/certs/api.yourdomain.com.pem;
    ssl_certificate_key /etc/ssl/private/api.yourdomain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 上传图片：multer 限 5M，留余量（nginx 默认 1M 会截断上传）
    client_max_body_size 10m;

    # 存量本地图片过渡期直出（新图已走 COS；migrate-uploads-to-cos 跑完并观察一个部署周期后可删除此块）
    location /uploads/ {
        alias /www/food-shop/apps/server/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 登录接口收紧限流
    location = /api/admin/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 微信支付/退款回调（/notify 与 /refund-notify）：原始 body 不能被压缩，且不走通用限流
    location /api/wechat/pay/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 不缓冲 body，透传原始字节
        proxy_request_buffering off;
    }

    # 快递100 回调（/deliver/callback）：突发请求不走通用限流，原始 body 需透传验签
    location /api/kd/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 不缓冲 body，透传原始字节（回调需验签，不能被缓冲或 gzip 干扰）
        proxy_request_buffering off;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        gzip on;
        gzip_types application/json;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000;
    }
}

# ============================================================
# 后台管理系统（React SPA）
# ============================================================
server {
    listen 80;
    server_name admin.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.yourdomain.com;

    ssl_certificate     /etc/ssl/certs/admin.yourdomain.com.pem;
    ssl_certificate_key /etc/ssl/private/admin.yourdomain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # admin 前端同源 API 反代(前端 axios baseURL=/api,生产必须有这段)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /www/food-shop-admin/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
