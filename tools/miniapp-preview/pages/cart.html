<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375">
<link rel="stylesheet" href="/cart.generated.css">
<style>html{--rpx:.5px}body{margin:0;width:375px;background:#f5f6f7}</style>
</head>
<body>
<div class="mp-page">
  <div class="page">
    <div>
      <div class="cart-list">

        <div class="cart-item card">
          <div class="checkbox checked"><div class="check-mark icon icon-check"></div></div>
          <div class="item-img-wrap"><div class="item-img-placeholder img-placeholder"></div></div>
          <div class="item-info">
            <span class="item-name">冷吃兔</span>
            <span class="item-spec">中辣/去骨</span>
            <div class="item-row">
              <div class="item-price-wrap"><span class="price-symbol">¥</span><span class="price-int item-price-int">45</span><span class="price-dec">.80</span></div>
              <div class="qty-control stepper">
                <div class="qty-btn stepper-btn"><span>−</span></div>
                <span class="qty-num stepper-num">2</span>
                <div class="qty-btn stepper-btn"><span>+</span></div>
              </div>
            </div>
          </div>
          <div class="delete-btn"><span class="delete-icon">✕</span></div>
        </div>

        <div class="cart-item card">
          <div class="checkbox checkbox-disabled"></div>
          <div class="item-img-wrap"><div class="item-img-placeholder img-placeholder"></div></div>
          <div class="item-info">
            <span class="item-name">秘制酱牛肉</span>
            <div class="item-row">
              <div class="item-price-wrap"><span class="price-symbol">¥</span><span class="price-int item-price-int">49</span><span class="price-dec">.80</span></div>
              <div class="qty-control stepper stepper-disabled">
                <div class="qty-btn stepper-btn"><span>−</span></div>
                <span class="qty-num stepper-num">1</span>
                <div class="qty-btn stepper-btn"><span>+</span></div>
              </div>
            </div>
            <span class="item-stock">该商品已下架</span>
          </div>
          <div class="delete-btn"><span class="delete-icon">✕</span></div>
        </div>

      </div>

      <div class="bottom-bar">
        <div class="total-wrap">
          <span class="total-label">合计</span>
          <span class="price-symbol">¥</span>
          <span class="price-int total-price-int">91</span>
          <span class="price-dec">.60</span>
        </div>
        <div class="checkout-btn btn-primary"><span>结算（1）</span></div>
      </div>
      <div class="bottom-spacer"></div>
    </div>
  </div>
</div>
</body>
</html>
