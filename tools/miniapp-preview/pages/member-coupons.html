<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375">
<link rel="stylesheet" href="/member-coupons.generated.css">
<style>html{--rpx:.5px}body{margin:0;width:375px;background:#f5f6f7}</style>
</head>
<body>
<div class="mp-page">
  <div class="page">

    <!-- 已登录；activeTab = 0「可用」。「已用/已过期」两页签的 is-dim / is-expired / coupon-stamp 不镜像 -->
    <div class="header">
      <div class="claim-entry">
        <div class="claim-entry-main">
          <span class="claim-entry-title">领券中心</span>
          <span class="claim-entry-sub">看看现在有哪些券可以领</span>
        </div>
        <span class="claim-entry-go">去领券</span>
        <div class="icon icon-arrow claim-entry-arrow"></div>
      </div>

      <div class="tab-list">
        <div class="tab-item active">可用</div>
        <div class="tab-item">已用</div>
        <div class="tab-item">已过期</div>
      </div>
    </div>

    <div class="coupon-list">

      <div class="coupon-card">
        <div class="coupon-face">
          <div class="coupon-amount">
            <span class="face-symbol">¥</span>
            <span class="face-int">5</span>
            <span class="face-dec">.00</span>
          </div>
          <span class="coupon-threshold">满 ¥30 可用</span>
        </div>
        <div class="coupon-body">
          <div class="coupon-title-row">
            <span class="coupon-name">新客立减券</span>
          </div>
          <span class="coupon-expire">有效期至 2026-10-05</span>
          <span class="coupon-code">券码 DGAF5A2K9QX7</span>
        </div>
      </div>

      <div class="coupon-card">
        <div class="coupon-face">
          <div class="coupon-amount">
            <span class="face-symbol">¥</span>
            <span class="face-int">10</span>
            <span class="face-dec">.00</span>
          </div>
          <span class="coupon-threshold">满 ¥68 可用</span>
        </div>
        <div class="coupon-body">
          <div class="coupon-title-row">
            <span class="coupon-name">同城配送满减券</span>
            <span class="channel-tag local">同城专享</span>
          </div>
          <span class="coupon-expire">有效期至 2026-09-30</span>
          <span class="coupon-code">券码 DGAF10C34T8M</span>
        </div>
      </div>

      <div class="coupon-card">
        <div class="coupon-face">
          <div class="coupon-amount">
            <span class="face-symbol">¥</span>
            <span class="face-int">20</span>
            <span class="face-dec">.00</span>
          </div>
          <span class="coupon-threshold">满 ¥100 可用</span>
        </div>
        <div class="coupon-body">
          <div class="coupon-title-row">
            <span class="coupon-name">邮寄满减券</span>
            <span class="channel-tag express">邮寄专享</span>
          </div>
          <span class="coupon-expire">有效期至 2026-12-31</span>
          <span class="coupon-code">券码 DGAF20H61B5N</span>
        </div>
      </div>

      <div class="list-foot">
        <span>优惠券只抵扣商品金额，不抵扣运费。每笔订单限用一张，不可叠加。</span>
      </div>

    </div>

  </div>
</div>
</body>
</html>
