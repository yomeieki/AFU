<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375">
<link rel="stylesheet" href="/order-list.generated.css">
<style>html{--rpx:.5px}body{margin:0;width:375px;background:#f5f6f7}</style>
</head>
<body>
<div class="mp-page">
  <div class="page">

    <div class="tab-scroll">
      <div class="tab-list">
        <div class="tab-item active">全部</div>
        <div class="tab-item">待付款</div>
        <div class="tab-item">待发货</div>
        <div class="tab-item">已发货</div>
        <div class="tab-item">已完成</div>
        <div class="tab-item">退款/售后</div>
        <div class="tab-item">已取消</div>
      </div>
    </div>

    <div class="order-list">

      <!-- 待付款：倒计时 + 去支付 -->
      <div class="order-card card">
        <div class="order-header">
          <span class="order-no">订单号：ORD20260707905563</span>
          <span class="tag tag-PENDING_PAYMENT">待付款</span>
        </div>
        <div class="order-item-row">
          <div class="order-item-img-wrap"><div class="order-item-img-ph img-placeholder"></div></div>
          <div class="order-item-info"><span class="order-item-name">冷吃兔</span><span class="order-item-spec">中辣/去骨</span><span class="order-item-qty">× 1</span></div>
          <span class="more-count">等2件</span>
        </div>
        <div class="order-footer">
          <div class="order-amount-wrap"><span class="order-amount-label">合计</span><span class="price-symbol">¥</span><span class="price-int order-amount-int">65</span><span class="price-dec">.70</span></div>
          <div class="order-action"><span class="countdown-text">剩余 12:34 自动取消</span><span class="action-btn pay">去支付</span></div>
        </div>
      </div>

      <!-- 自取单：渠道标签「自取」+ 状态「待取餐」（SHIPPED 复用） -->
      <div class="order-card card">
        <div class="order-header">
          <div class="order-meta"><span class="delivery-type-tag pickup">自取</span><span class="order-no">订单号：ORD20260911422501</span></div>
          <span class="order-status-tag order-status-SHIPPED">待取餐</span>
        </div>
        <div class="order-item-row">
          <div class="order-item-img-wrap"><div class="order-item-img-ph img-placeholder"></div></div>
          <div class="order-item-info"><span class="order-item-name">夫妻肺片</span><span class="order-item-qty">× 1</span></div>
        </div>
        <div class="order-footer">
          <div class="order-amount-wrap"><span class="order-amount-label">合计</span><span class="price-symbol">¥</span><span class="price-int order-amount-int">25</span><span class="price-dec">.20</span></div>
          <div class="order-action"></div>
        </div>
      </div>

      <!-- 已发货：部分退款 + 售后已退款（order-extra） -->
      <div class="order-card card">
        <div class="order-header">
          <span class="order-no">订单号：ORD20260707448142</span>
          <span class="tag tag-SHIPPED">已发货</span>
        </div>
        <div class="order-item-row">
          <div class="order-item-img-wrap"><div class="order-item-img-ph img-placeholder"></div></div>
          <div class="order-item-info"><span class="order-item-name">冷吃兔</span><span class="order-item-spec">中辣/去骨</span><span class="order-item-qty">× 1</span></div>
          <span class="more-count">等2件</span>
        </div>
        <div class="order-footer">
          <div class="order-amount-wrap"><span class="order-amount-label">合计</span><span class="price-symbol">¥</span><span class="price-int order-amount-int">53</span><span class="price-dec">.80</span></div>
          <div class="order-action"></div>
        </div>
        <div class="order-extra"><span>已退 ¥8.00 · 售后已退款</span></div>
      </div>

      <div class="order-card card">
        <div class="order-header">
          <span class="order-no">订单号：ORD20260509842293</span>
          <span class="tag tag-COMPLETED">已完成</span>
        </div>
        <div class="order-item-row">
          <div class="order-item-img-wrap"><div class="order-item-img-ph img-placeholder"></div></div>
          <div class="order-item-info"><span class="order-item-name">年货礼盒（豪华版）</span><span class="order-item-qty">× 1</span></div>
        </div>
        <div class="order-footer">
          <div class="order-amount-wrap"><span class="order-amount-label">合计</span><span class="price-symbol">¥</span><span class="price-int order-amount-int">298</span><span class="price-dec">.00</span></div>
          <div class="order-action"></div>
        </div>
      </div>

      <div class="footer-tip"><span>- 没有更多了 -</span></div>
    </div>
  </div>
</div>
</body>
</html>
