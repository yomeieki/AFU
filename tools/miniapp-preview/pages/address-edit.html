<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375">
<link rel="stylesheet" href="/address-edit.generated.css">
<style>html{--rpx:.5px}body{margin:0;width:375px;background:#f5f6f7}</style>
</head>
<body>
<div class="mp-page">
  <div class="page">
    <div class="form">

      <div class="field-group">
        <div class="field"><span class="label">收货人</span><input class="input" value="张三"></div>
        <div class="field"><span class="label">手机号</span><input class="input" value="13800138000"></div>
      </div>

      <div class="field-group">
        <div class="field"><span class="label">省份</span><input class="input" value="广东省"></div>
        <div class="field"><span class="label">城市</span><input class="input" value="深圳市"></div>
        <div class="field"><span class="label">区县</span><input class="input" value="南山区"></div>
        <div class="field"><span class="label">详细地址</span><input class="input" value="科技园 1 号楼 301 室"></div>
      </div>

      <div class="field-group">
        <div class="field switch-field">
          <span class="label">设为默认地址</span>
          <div class="switch on"><div class="switch-thumb"></div></div>
        </div>
      </div>

    </div>

    <div class="save-btn btn-primary"><span>保存地址</span></div>
  </div>
</div>
</body>
</html>
