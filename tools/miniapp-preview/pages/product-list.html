<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375">
<link rel="stylesheet" href="/product-list.generated.css">
<style>
  html{--rpx:.5px}
  body{margin:0;width:375px;height:720px;background:#f5f6f7;overflow:hidden}
  /* scroll-view 在浏览器里用 overflow 模拟；页面高度 = tabBar 以上区域，此处固定 720 */
  .mp-page{height:720px}
  .cat-panel,.prod-panel{overflow-y:auto}
</style>
</head>
<body>
<div class="mp-page">
  <div class="page">

    <div class="search-bar">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" placeholder="搜索商品" value="">
      </div>
    </div>

    <div class="promo-bar"><span class="promo-badge">减</span><span class="promo-summary">全店满减　满 200 减 20 · 满 300 减 35</span><span class="promo-detail">详情 ›</span></div>

    <div class="body">

      <div class="cat-panel">
        <div class="cat-item active"><div class="cat-item-bar"></div><span class="cat-item-name">凉菜</span></div>
        <div class="cat-item"><div class="cat-item-bar"></div><span class="cat-item-name">熟食</span></div>
        <div class="cat-item"><div class="cat-item-bar"></div><span class="cat-item-name">卤味</span></div>
        <div class="cat-item"><div class="cat-item-bar"></div><span class="cat-item-name">礼盒</span></div>
        <div class="cat-item"><div class="cat-item-bar"></div><span class="cat-item-name">自贡特产</span></div>
      </div>

      <div class="prod-wrap">
      <div class="group-head group-float">凉菜</div>
      <div class="prod-panel">
        <div class="group-anchor"><div class="group-head">凉菜</div>
        <div class="product-list">
          <div class="product-row">
            <div class="product-row-img-wrap"><div class="product-row-img-placeholder img-placeholder"></div></div>
            <div class="product-row-info">
              <span class="product-row-name">冷吃兔</span>
              <span class="product-row-subtitle">自贡招牌，麻辣鲜香</span>
              <div class="product-row-meta"><span class="product-row-stock">有货</span><span class="product-row-sales">已售262</span></div>
              <div class="product-row-bottom"><span class="price-symbol">¥</span><span class="price-int product-row-price-int">45</span><span class="price-dec">.80</span><span class="product-row-price-from">起</span><span class="product-row-unit">/ 份</span></div>
            </div>
          </div>
          <div class="product-row">
            <div class="product-row-img-wrap"><div class="product-row-img-placeholder img-placeholder"></div></div>
            <div class="product-row-info">
              <span class="product-row-name">凉拌折耳根</span>
              <span class="product-row-subtitle">每日新鲜制作</span>
              <div class="product-row-meta"><span class="product-row-stock">有货</span><span class="product-row-sales">已售128</span></div>
              <div class="product-row-bottom"><span class="price-symbol">¥</span><span class="price-int product-row-price-int">12</span><span class="price-dec">.00</span><span class="product-row-unit">/ 份</span></div>
            </div>
          </div>
          <div class="product-row">
            <div class="product-row-img-wrap"><div class="product-row-img-placeholder img-placeholder"></div></div>
            <div class="product-row-info">
              <span class="product-row-name">麻辣牛肉</span>
              <span class="product-row-subtitle">秘制卤水，入口即化</span>
              <div class="product-row-meta"><span class="product-row-stock">仅剩 5 件</span><span class="product-row-sales">已售45</span></div>
              <div class="product-row-bottom"><span class="price-symbol">¥</span><span class="price-int product-row-price-int">39</span><span class="price-dec">.90</span><span class="product-row-unit">/ 份</span></div>
            </div>
          </div>
          <div class="product-row">
            <div class="product-row-img-wrap"><div class="product-row-img-placeholder img-placeholder"></div></div>
            <div class="product-row-info">
              <span class="product-row-name">口水鸡</span>
              <span class="product-row-subtitle">红油香麻</span>
              <div class="product-row-meta"><span class="product-row-stock">有货</span><span class="product-row-sales">已售88</span></div>
              <div class="product-row-bottom"><span class="price-symbol">¥</span><span class="price-int product-row-price-int">28</span><span class="price-dec">.00</span><span class="product-row-unit">/ 份</span></div>
            </div>
          </div>
        </div>
        </div>
        <div class="group-tail" style="height:0px"></div>
        <div class="cart-spacer" style="height:72px"></div>
      </div>

      </div>
    </div>
  </div>
<div class="cart-dock"><div class="cart-tip "><span class="cart-tip-em">已减 ¥20 · 再买 ¥89 可减 ¥35</span></div><div class="local-cart-bar"><div class="cart-summary"><div class="cart-icon"><div class="cart-drawing"></div><div class="cart-badge">7</div></div><div class="cart-summary-text"><div class="cart-summary-main"><span class="cart-summary-amount">¥191.00</span><span class="cart-summary-orig">¥211.00</span></div><span class="cart-summary-sub">共 7 件 · 已减 ¥20 · 运费结算时算</span></div></div><div class="checkout-btn btn-primary">去结算 · 邮寄</div></div></div>
</div>
</body>
</html>
