<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375">
<link rel="stylesheet" href="/product-list.generated.css">
<style>html{--rpx:.5px}body{margin:0;width:375px;background:#f5f6f7}</style>
</head>
<body>
<div class="mp-page">
  <div class="page">

    <div class="search-bar">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" placeholder="搜索商品" value="猪头肉">
        <div class="search-clear"><span>搜索</span></div>
      </div>
    </div>

    <div class="category-tag-bar">
      <div class="category-tag"><span class="category-tag-text">熟食</span><span class="category-tag-close">×</span></div>
    </div>

    <div class="product-list">
      <div class="product-row">
        <div class="product-row-img-wrap"><div class="product-row-img-placeholder img-placeholder"></div></div>
        <div class="product-row-info">
          <span class="product-row-name">招牌猪头肉</span>
          <span class="product-row-subtitle">每日新鲜制作，限量供应</span>
          <div class="product-row-meta"><span class="product-row-stock">有货</span><span class="product-row-sales">已售262</span></div>
          <div class="product-row-bottom"><span class="price-symbol">¥</span><span class="price-int product-row-price-int">29</span><span class="price-dec">.90</span><span class="product-row-unit">/ 份</span></div>
        </div>
      </div>
      <div class="product-row">
        <div class="product-row-img-wrap"><div class="product-row-img-placeholder img-placeholder"></div></div>
        <div class="product-row-info">
          <span class="product-row-name">秘制酱牛肉</span>
          <span class="product-row-subtitle">传统工艺，入口即化</span>
          <div class="product-row-meta"><span class="product-row-stock">有货</span><span class="product-row-sales">已售128</span></div>
          <div class="product-row-bottom"><span class="price-symbol">¥</span><span class="price-int product-row-price-int">49</span><span class="price-dec">.80</span><span class="product-row-unit">/ 份</span></div>
        </div>
      </div>
      <div class="product-row">
        <div class="product-row-img-wrap"><div class="product-row-img-placeholder img-placeholder"></div></div>
        <div class="product-row-info">
          <span class="product-row-name">年货礼盒（豪华版）</span>
          <span class="product-row-subtitle">精选8款熟食，送礼佳品</span>
          <div class="product-row-meta"><span class="product-row-stock">仅剩 5 件</span><span class="product-row-sales">已售45</span></div>
          <div class="product-row-bottom"><span class="price-symbol">¥</span><span class="price-int product-row-price-int">298</span><span class="price-dec">.00</span><span class="product-row-unit">/ 盒</span></div>
        </div>
      </div>
    </div>

    <div class="footer-tip"><span>- 没有更多了 -</span></div>
  </div>
</div>
</body>
</html>
