<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375">
<link rel="stylesheet" href="/user.generated.css">
<style>html{--rpx:.5px}body{margin:0;width:375px;background:#f5f6f7}</style>
</head>
<body>
<div class="mp-page">
  <div class="page">

    <div class="user-header">
      <div class="header-deco header-deco-1"></div>
      <div class="header-deco header-deco-2"></div>
      <div class="avatar-wrap">
        <div class="avatar-placeholder"><span class="avatar-icon">👤</span></div>
      </div>
      <div class="user-info">
        <span class="user-name">微信用户</span>
      </div>
    </div>

    <div class="menu-section card">
      <div class="menu-section-header">
        <span class="menu-section-title">我的订单</span>
        <div class="menu-section-more"><span>全部订单</span><div class="more-arrow icon icon-arrow"></div></div>
      </div>
      <div class="order-shortcuts">
        <div class="shortcut-item"><div class="shortcut-icon icon icon-pay"></div><span class="shortcut-label">待付款</span></div>
        <div class="shortcut-item"><div class="shortcut-icon icon icon-ship"></div><span class="shortcut-label">待发货</span></div>
        <div class="shortcut-item"><div class="shortcut-icon icon icon-truck"></div><span class="shortcut-label">已发货</span></div>
        <div class="shortcut-item"><div class="shortcut-icon icon icon-done"></div><span class="shortcut-label">已完成</span></div>
      </div>
    </div>

    <div class="menu-section card">
      <div class="menu-list">
        <div class="menu-item">
          <div class="menu-icon icon icon-pin"></div>
          <span class="menu-label">收货地址</span>
          <div class="menu-arrow icon icon-arrow"></div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
