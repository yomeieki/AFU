<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375">
<link rel="stylesheet" href="/order-confirm.generated.css">
<style>html{--rpx:.5px}body{margin:0;width:375px;background:#f5f6f7}</style>
</head>
<body>
<div class="mp-page">
  <div class="page">

    <div class="section card address-section">
      <div class="address-pin icon icon-pin"></div>
      <div class="address-info">
        <div class="receiver-row"><span class="receiver-name">张三</span><span class="receiver-phone">138 0013 8000</span></div>
        <span class="address-full">广东省深圳市南山区科技园 1 号楼 301 室</span>
      </div>
      <div class="arrow icon icon-arrow"></div>
    </div>

    <div class="section card">
      <div class="section-title">商品明细</div>
      <div class="item-list">
        <div class="item-row">
          <div class="item-img-wrap"><div class="item-img-ph img-placeholder"></div></div>
          <div class="item-info"><span class="item-name">冷吃兔</span><span class="item-spec">中辣/去骨</span><span class="item-qty">× 2</span></div>
          <span class="item-subtotal">¥91.60</span>
        </div>
        <div class="item-row">
          <div class="item-img-wrap"><div class="item-img-ph img-placeholder"></div></div>
          <div class="item-info"><span class="item-name">蜜汁叉烧</span><span class="item-qty">× 1</span></div>
          <span class="item-subtotal">¥35.80</span>
        </div>
      </div>
    </div>

    <div class="section card">
      <div class="row"><span class="row-label">配送方式</span><span class="row-value">快递配送</span></div>
    </div>

    <div class="section card">
      <div class="row"><span class="row-label">备注</span><input class="remark-input" placeholder="选填，如配送时间要求"></div>
    </div>

    <div class="section card">
      <div class="row"><span class="row-label">商品金额</span><span class="row-value">¥127.40</span></div>
      <div class="row"><span class="row-label">运费</span><span class="row-value free">免运费</span></div>
      <div class="row total-row">
        <span class="row-label">合计</span>
        <div class="total-price-wrap"><span class="price-symbol">¥</span><span class="price-int total-price-int">127</span><span class="price-dec">.40</span></div>
      </div>
    </div>

    <div class="spacer"></div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-total-wrap"><span class="bottom-total-label">合计</span><span class="price-symbol">¥</span><span class="price-int bottom-total-int">127</span><span class="price-dec">.40</span></div>
    <div class="submit-btn btn-primary"><span>提交订单</span></div>
  </div>
</div>
</body>
</html>
