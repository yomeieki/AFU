<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375">
<link rel="stylesheet" href="/order-detail.generated.css">
<style>html{--rpx:.5px}body{margin:0;width:375px;background:#f5f6f7}</style>
</head>
<body>
<div class="mp-page">
  <div class="page">

    <div class="status-banner SHIPPED">
      <span class="status-label">已发货</span>
      <span class="status-order-no">ORD20260707448142</span>
    </div>

    <div class="card">
      <div class="address-row">
        <div class="address-pin icon icon-pin"></div>
        <div class="address-body">
          <div class="receiver-row"><span class="receiver-name">张三</span><span class="receiver-phone">138 0013 8000</span></div>
          <span class="receiver-address">广东省深圳市南山区科技园 1 号楼 301 室</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">商品信息</div>
      <div class="item-list">
        <div class="item-row">
          <div class="item-img-wrap"><div class="item-img-ph img-placeholder"></div></div>
          <div class="item-info"><span class="item-name">冷吃兔</span><span class="item-spec">中辣/去骨</span><span class="item-price">¥45.80 × 1</span></div>
          <span class="item-subtotal">¥45.80</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="amount-row"><span class="amount-label">商品金额</span><span class="amount-value">¥45.80</span></div>
      <div class="amount-row"><span class="amount-label">运费</span><span class="amount-value">免运费</span></div>
      <div class="amount-row total-row">
        <span class="amount-label">合计</span>
        <div class="total-price-wrap"><span class="price-symbol">¥</span><span class="price-int total-price-int">45</span><span class="price-dec">.80</span></div>
      </div>
    </div>

    <div class="card">
      <div class="info-row"><span class="info-label">订单号</span><span class="info-value">ORD20260707448142</span></div>
      <div class="info-row"><span class="info-label">下单时间</span><span class="info-value">2026-07-07 16:01</span></div>
      <div class="info-row"><span class="info-label">支付时间</span><span class="info-value">2026-07-07 16:02</span></div>
    </div>

    <div class="card">
      <div class="card-title">物流信息</div>
      <div class="info-row"><span class="info-label">快递公司</span><span class="info-value">顺丰速运</span></div>
      <div class="info-row"><span class="info-label">快递单号</span><span class="info-value">SF1234567890</span></div>
    </div>

    <div class="spacer"></div>
  </div>

  <div class="action-bar">
    <div class="pay-btn btn-primary"><span>确认收货</span></div>
  </div>
</div>
</body>
</html>
