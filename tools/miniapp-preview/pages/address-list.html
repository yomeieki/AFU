<!doctype html>

<div class="mp-page">

          <div class="address-pin icon icon-pin"></div>

        </div>

        <div class="address-card card">

        </div>

      </div>

      <div class="add-btn-wrap safe-bottom">

      </div>
      <div class="add-btn-spacer"></div>

</html>
